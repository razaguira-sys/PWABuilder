name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Creer les fichiers de l'application
        run: |
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EmpireInter"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.empireinter.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.empireinter.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.EmpireInter">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/empireinter/app
          cat > app/src/main/java/com/empireinter/app/MainActivity.java <<'EOF_5'
          package com.empireinter.app;

          import android.annotation.SuppressLint;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;

          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private static final String START_URL = "https://empireinter.netlify.app/app";
              private static final String HOST = "empireinter.netlify.app";
              private static final int FILE_CHOOSER_CODE = 1001;

              private WebView webView;
              private ProgressBar progressBar;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  progressBar = findViewById(R.id.progress);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setAllowFileAccess(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (("http".equals(scheme) || "https".equals(scheme)) && HOST.equals(uri.getHost())) {
                              return false; // reste dans l'application
                          }
                          // WhatsApp, mailto, tel, liens externes : ouverts hors de l'app
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException ignored) {
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                          progressBar.setVisibility(newProgress < 100 ? View.VISIBLE : View.GONE);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_CHOOSER_CODE);
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }
          }
          EOF_5
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0a1f44">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:layout_gravity="top"
                  android:max="100"
                  android:progressTint="#f5b800" />
          </FrameLayout>
          EOF_6
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_7'
          <resources>
              <string name="app_name">Empire Inter</string>
          </resources>
          EOF_7
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_8'
          <resources>
              <style name="Theme.EmpireInter" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">#0a1f44</item>
                  <item name="android:navigationBarColor">#0a1f44</item>
                  <item name="android:windowBackground">@color/ic_launcher_background</item>
              </style>
          </resources>
          EOF_8
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_9'
          <resources>
              <color name="ic_launcher_background">#0a1f44</color>
          </resources>
          EOF_9
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_10'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Lettre "E" dorée, dans la zone sûre de l'icône adaptative -->
              <path
                  android:fillColor="#f5b800"
                  android:pathData="M34,30 L74,30 L74,40 L45,40 L45,49 L68,49 L68,59 L45,59 L45,68 L74,68 L74,78 L34,78 Z" />
          </vector>
          EOF_10
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_11'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EmpireInter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
